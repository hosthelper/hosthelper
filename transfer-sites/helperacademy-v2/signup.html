<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | 헬퍼아카데미</title><link rel="stylesheet" href="./academy.css"></head><body class="auth-body"><main class="auth-shell"><section class="auth-brand"><div><div class="brand"><span class="mark">H</span>헬퍼아카데미</div><h1>6개월 안에<br>첫 숙소 오픈을 목표로.</h1><p>회원가입 후 무료 진단부터 강의·실행과제·멘토링·수익 행동까지 하나의 학습 여정으로 이어집니다.</p><div class="auth-points"><div class="auth-point">STEP 0 · 무료 오픈진단</div><div class="auth-point">STEP 1 · 실행형 과정</div><div class="auth-point">MEMBER · 헬퍼유니버스 통합 회원번호</div></div></div><small>Helper Universe · OPEN</small></section><section class="auth-card"><h2>회원가입</h2><p>간편가입 또는 이메일로 헬퍼아카데미 회원이 됩니다.</p><label class="auth-check social-consent"><input type="checkbox" data-social-consent><span>간편가입을 계속하면 계정 생성 및 헬퍼아카데미 학습정보 저장에 동의합니다.</span></label><div class="social-auth"><button type="button" class="social-btn google" data-oauth="google" disabled><span class="social-icon">G</span><span>Google로 가입하기</span></button><button type="button" class="social-btn kakao" data-oauth="kakao" disabled><span class="social-icon">K</span><span>카카오로 가입하기</span></button><button type="button" class="social-btn apple" data-oauth="apple" disabled><span class="social-icon">A</span><span>Apple로 가입하기</span></button></div><div class="provider-status" data-provider-status>간편가입 상태를 확인하는 중입니다.</div><div class="auth-divider"><span>또는 이메일</span></div><form class="form"><label>이름 또는 닉네임<input name="name" autocomplete="name" required maxlength="40" placeholder="예: 김헬퍼"></label><label>이메일<input type="email" name="email" autocomplete="email" required placeholder="name@example.com"></label><label>비밀번호<input type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상"></label><label>비밀번호 확인<input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required placeholder="비밀번호 다시 입력"></label><label class="auth-check"><input type="checkbox" required><span>서비스 이용에 필요한 계정 생성과 학습 진행정보 저장에 동의합니다.</span></label><button type="submit" class="btn block">이메일로 회원가입</button></form><div class="auth-message" role="status"></div><div class="auth-switch">이미 회원이신가요? <a href="./login.html">로그인</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script src="./academy-backend.js"></script><script src="./academy-login.js"></script></body></html>
