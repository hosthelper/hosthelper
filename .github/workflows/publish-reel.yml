name: 창업정보 릴스 자동 게시 (인스타·유튜브)

# 데일리 릴스 빌드가 끝나면(=합성 완료) 인스타 릴스 + 스레드 + 유튜브 쇼츠에 자동 게시.
#
# [중요] 트리거가 push 가 아니라 workflow_run 인 이유:
#   build-reel-daily 는 GITHUB_TOKEN 으로 main 에 푸시한다. GitHub Actions 는
#   GITHUB_TOKEN 으로 만든 커밋에 대해 push 워크플로를 트리거하지 않는다
#   (workflow_dispatch·repository_dispatch 만 예외). 커밋 메시지의 [skip ci] 를
#   지워도 마찬가지다. workflow_run 은 이 제약을 받지 않으므로 새 시크릿 없이 동작한다.
#
# 토큰(Secrets)이 없으면 각 채널을 조용히 건너뜁니다 — 세팅 전에도 CI가 실패하지 않음.
# 주의: 워크플로가 초록색이어도 게시되지 않았을 수 있습니다. 판정은 Notify Telegram 메시지의
#       채널별 상태(skip/ok/error)로 하세요.
# 필요한 Secrets:
#   META_ACCESS_TOKEN, IG_USER_ID                (인스타 릴스)
#   THREADS_ACCESS_TOKEN, THREADS_USER_ID         (스레드 @changupmoim)
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN (유튜브 쇼츠)
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID          (결과 알림, 선택)
# 자세한 발급법: apps/changup-site/reel/daily/PUBLISH_SETUP.md

on:
  workflow_run:
    workflows: ["창업정보 데일리 릴스 빌드"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-reel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.repository == 'hosthelper/hosthelper' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@v4
        # fetch-depth 2 이상이어야 아래 "이번 커밋에 릴스 변경이 있었는지" 판정이 가능하다.
        with: { ref: main, fetch-depth: 2 }

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Resolve reel + caption
        id: meta
        run: |
          set -euo pipefail
          M=apps/changup-site/reel/daily/manifest.json
          PREFIX=$(jq -r '.prefix' "$M")

          # 중복 게시 방지 — 빌드가 "no changes" 로 끝나도 workflow_run 은 발화한다.
          # 수동 실행이 아니면, 이번 HEAD 커밋이 해당 릴스를 건드렸을 때만 게시한다.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            LAST=$(git log -1 --format=%H -- "apps/changup-site/reel/reel_${PREFIX}.mp4")
            if [ "$LAST" != "$(git rev-parse HEAD)" ]; then
              echo "이번 커밋에 reel_${PREFIX}.mp4 변경 없음 — 게시 건너뜀"
              echo "skip=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          TITLE=$(jq -r '.title // "창업정보 모임"' "$M")
          CAPTION=$(jq -r '.caption // empty' "$M")
          if [ -z "$CAPTION" ]; then
            CAPTION=$(printf '%s\n\n계약 전에 꼭 확인하세요.\n인수 전 3종 안심 패키지 무료.\n공인중개사 연결 가능 · 계약은 공인중개사를 통해.\n\n동네 창업 이야기는 당근에서 '\''창업정보 모임'\'' 검색.\n자세한 건 프로필 링크.\nhttps://changup-moim.netlify.app/?utm_source=instagram\n\n#창업정보 #점포양수도 #권리금 #상권분석 #자영업' "$TITLE")
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "video_url=https://raw.githubusercontent.com/hosthelper/hosthelper/main/apps/changup-site/reel/reel_${PREFIX}.mp4" >> "$GITHUB_OUTPUT"
          { echo 'caption<<EOF'; echo "$CAPTION"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          { echo 'title<<EOF'; echo "$TITLE"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Publish Instagram Reel
        id: ig
        if: ${{ steps.meta.outputs.skip != '1' }}
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ secrets.IG_API_HOST }}
          VIDEO_URL: ${{ steps.meta.outputs.video_url }}
          CAPTION: ${{ steps.meta.outputs.caption }}
        run: |
          set -uo pipefail
          if [ -z "${META_ACCESS_TOKEN:-}" ] || [ -z "${IG_USER_ID:-}" ]; then
            echo "IG 토큰 미설정 — 인스타 게시 건너뜀"; echo "status=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          GV=v21.0
          # 인스타 로그인 기반 API(페이스북 페이지 불필요) = graph.instagram.com.
          # 페이지 연결 방식(graph.facebook.com)을 쓰려면 Secret IG_API_HOST 를 graph.facebook.com 으로 지정.
          GH="${IG_API_HOST:-graph.instagram.com}"
          CREATE=$(curl -sS -X POST "https://$GH/$GV/$IG_USER_ID/media" \
            -d "media_type=REELS" --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=$CAPTION" -d "access_token=$META_ACCESS_TOKEN")
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          if [ -z "$CID" ]; then echo "IG 생성 실패: $CREATE"; echo "status=error" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 업로드 처리 대기 (최대 5분)
          for i in $(seq 1 30); do
            sleep 10
            ST=$(curl -sS "https://$GH/$GV/$CID?fields=status_code&access_token=$META_ACCESS_TOKEN" | jq -r '.status_code // empty')
            echo "IG 처리상태: $ST"
            [ "$ST" = "FINISHED" ] && break
            [ "$ST" = "ERROR" ] && { echo "IG 처리 오류"; echo "status=error" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          PUB=$(curl -sS -X POST "https://$GH/$GV/$IG_USER_ID/media_publish" \
            -d "creation_id=$CID" -d "access_token=$META_ACCESS_TOKEN")
          PID=$(echo "$PUB" | jq -r '.id // empty')
          if [ -n "$PID" ]; then echo "IG 게시 완료 id=$PID"; echo "status=ok" >> "$GITHUB_OUTPUT"; else echo "IG 게시 실패: $PUB"; echo "status=error" >> "$GITHUB_OUTPUT"; fi

      - name: Publish Threads
        id: th
        if: ${{ steps.meta.outputs.skip != '1' }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          VIDEO_URL: ${{ steps.meta.outputs.video_url }}
          CAPTION: ${{ steps.meta.outputs.caption }}
        run: |
          set -uo pipefail
          if [ -z "${THREADS_ACCESS_TOKEN:-}" ] || [ -z "${THREADS_USER_ID:-}" ]; then
            echo "스레드 토큰 미설정 — 스레드 게시 건너뜀"; echo "status=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          GT=https://graph.threads.net/v1.0
          CREATE=$(curl -sS -X POST "$GT/$THREADS_USER_ID/threads" \
            -d "media_type=VIDEO" --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "text=$CAPTION" -d "access_token=$THREADS_ACCESS_TOKEN")
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          if [ -z "$CID" ]; then echo "스레드 생성 실패: $CREATE"; echo "status=error" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 미디어 처리 대기 (최대 5분)
          for i in $(seq 1 30); do
            sleep 10
            ST=$(curl -sS "$GT/$CID?fields=status&access_token=$THREADS_ACCESS_TOKEN" | jq -r '.status // empty')
            echo "스레드 처리상태: $ST"
            [ "$ST" = "FINISHED" ] && break
            [ "$ST" = "ERROR" ] && { echo "스레드 처리 오류"; echo "status=error" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          PUB=$(curl -sS -X POST "$GT/$THREADS_USER_ID/threads_publish" \
            -d "creation_id=$CID" -d "access_token=$THREADS_ACCESS_TOKEN")
          PID=$(echo "$PUB" | jq -r '.id // empty')
          if [ -n "$PID" ]; then echo "스레드 게시 완료 id=$PID"; echo "status=ok" >> "$GITHUB_OUTPUT"; else echo "스레드 게시 실패: $PUB"; echo "status=error" >> "$GITHUB_OUTPUT"; fi

      - name: Publish YouTube Short
        id: yt
        if: ${{ steps.meta.outputs.skip != '1' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_URL: ${{ steps.meta.outputs.video_url }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -uo pipefail
          if [ -z "${YT_CLIENT_ID:-}" ] || [ -z "${YT_CLIENT_SECRET:-}" ] || [ -z "${YT_REFRESH_TOKEN:-}" ]; then
            echo "YT 토큰 미설정 — 유튜브 게시 건너뜀"; echo "status=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AT=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$YT_CLIENT_ID" -d client_secret="$YT_CLIENT_SECRET" \
            -d refresh_token="$YT_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r '.access_token // empty')
          if [ -z "$AT" ]; then echo "YT 액세스 토큰 발급 실패"; echo "status=error" >> "$GITHUB_OUTPUT"; exit 0; fi
          curl -sSL "$VIDEO_URL" -o reel.mp4
          DESC=$(printf '%s\n\n계약은 공인중개사를 통해 진행하세요. 필요하시면 공인중개사 연결까지 도와드립니다.\n창업 매물·상권 정보는 프로필 링크.\n#Shorts #창업 #점포양수도 #권리금' "$TITLE")
          META=$(jq -n --arg t "$TITLE (#Shorts)" --arg d "$DESC" \
            '{snippet:{title:$t,description:$d,categoryId:"22"},status:{privacyStatus:"private",selfDeclaredMadeForKids:false}}')
          RESP=$(curl -sS -X POST \
            "https://www.googleapis.com/upload/youtube/v3/videos?part=snippet,status&uploadType=multipart" \
            -H "Authorization: Bearer $AT" \
            -F "metadata=$META;type=application/json" \
            -F "media=@reel.mp4;type=video/mp4")
          VID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -n "$VID" ]; then echo "YT 업로드 완료(비공개) id=$VID"; echo "status=ok" >> "$GITHUB_OUTPUT"; else echo "YT 업로드 실패: $RESP"; echo "status=error" >> "$GITHUB_OUTPUT"; fi

      - name: Notify Telegram
        if: ${{ always() && steps.meta.outputs.skip != '1' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREFIX: ${{ steps.meta.outputs.prefix }}
          IG: ${{ steps.ig.outputs.status }}
          TH: ${{ steps.th.outputs.status }}
          YT: ${{ steps.yt.outputs.status }}
        run: |
          set -uo pipefail
          [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ] && { echo "텔레그램 알림 미설정 — 종료"; exit 0; }
          MSG="[릴스 자동 게시] ${PREFIX} — 인스타: ${IG:-skip} · 스레드: ${TH:-skip} · 유튜브: ${YT:-skip}. private로 올라간 경우 확인 후 공개로 전환하세요."
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$MSG" >/dev/null || true
