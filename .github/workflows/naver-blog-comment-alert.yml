name: Naver Blog Comment Alert

on:
  schedule:
    # Every 30 minutes. Offset avoids top-of-hour GitHub Actions congestion.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/naver-blog-comment-monitor-v3.mjs'
      - '.github/workflows/naver-blog-comment-alert.yml'

permissions:
  contents: write

concurrency:
  group: naver-blog-comment-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NAVER_BLOG_ID: kimtaewook86
      KAKAO_SEND_ENDPOINT: https://auction-community-pearl.vercel.app/api/kakao/send
      NAVER_COMMENT_STATE_REPO: hosthelper/hosthelper
      NAVER_COMMENT_STATE_BRANCH: runtime/seocho-cleaning-state-v2
      NAVER_COMMENT_STATE_PATH: helper-office-worker/runtime/naver-blog-comment-state.json
      NAVER_COMMENT_MAX_POSTS: '20'
    steps:
      - name: Checkout monitor code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check new Naver blog comments and send Kakao alert
        run: node scripts/naver-blog-comment-monitor-v3.mjs
